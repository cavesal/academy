<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas médico · CaVeSal® Academy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="atlas.css">
<style>.lst{display:grid;gap:10px;margin:12px 0}.lst a{display:block;text-decoration:none;border:1px solid var(--line);border-left:5px solid var(--teal);background:#fff;border-radius:10px;padding:12px 14px}.lst b{display:block;color:var(--navy)}.lst span{font-size:.86rem;color:var(--muted)}</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="marca" href="../#/" aria-label="CaVeSal Academy">
      <img src="../img/icon-192.png" alt="" width="40" height="40">
      <span class="marca-txt"><strong>CaVeSal<sup>®</sup> Academy</strong><small data-t="atlas">Atlas médico</small></span>
    </a>
  </div>
</header>
<main class="at" id="main">
  <div class="at-top">
    <a class="volver" href="../#/" data-t="volver">← Volver a Academy</a>
    <div class="idi" role="group" aria-label="Idioma">
      <button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button><button type="button" data-l="pt">PT</button>
    </div>
  </div>
  <span class="eyebrow" data-t="ruta">Ginecología y Obstetricia</span>
  <h1 data-t="tit">Atlas médico</h1>
  <p class="baj" data-t="baj">Láminas interactivas con esquemas propios e imágenes reales con licencia libre.</p>
  <div class="bus">
    <input type="search" id="q" autocomplete="off" data-ph="ph" placeholder="Buscar lámina, término o clasificación">
    <div class="chips" id="ej1" role="group"></div>
    <div class="chips" id="ej2" role="group"></div>
  </div>
  <div class="lst" id="lst"></div>
  <p class="nota" id="nada" hidden data-t="nada">Ninguna lámina coincide con la búsqueda.</p>
  <p class="nota" data-t="prox">Próximas láminas: según la hoja de ruta del Atlas.</p>
</main>
<script src="atlas.js"></script>
<script>
(function () {
  var A = window.Atlas;
  var UI = {
    es: { atlas: 'Atlas médico', volver: '← Volver a Academy', ruta: 'Ginecología y Obstetricia', tit: 'Atlas médico', baj: 'Láminas interactivas con esquemas propios e imágenes reales con licencia libre.', prox: 'Próximas láminas: según la hoja de ruta del Atlas.', ph: 'Buscar lámina, término o clasificación', nada: 'Ninguna lámina coincide con la búsqueda.', ax1: ['Todas', 'Ginecología', 'Obstetricia'], ax2: ['Todos los temas', 'Ecografía', 'Placenta', 'Hemorragia', 'Líquido amniótico'] },
    en: { atlas: 'Medical atlas', volver: '← Back to Academy', ruta: 'Gynecology and Obstetrics', tit: 'Medical atlas', baj: 'Interactive plates with our own drawings and freely licensed real images.', prox: 'Coming plates: according to the Atlas roadmap.', ph: 'Search plate, term or classification', nada: 'No plate matches the search.', ax1: ['All', 'Gynecology', 'Obstetrics'], ax2: ['All topics', 'Ultrasound', 'Placenta', 'Hemorrhage', 'Amniotic fluid'] },
    pt: { atlas: 'Atlas médico', volver: '← Voltar ao Academy', ruta: 'Ginecologia e Obstetrícia', tit: 'Atlas médico', baj: 'Lâminas interativas com esquemas próprios e imagens reais com licença livre.', prox: 'Próximas lâminas: segundo o roteiro do Atlas.', ph: 'Buscar lâmina, termo ou classificação', nada: 'Nenhuma lâmina corresponde à busca.', ax1: ['Todas', 'Ginecologia', 'Obstetrícia'], ax2: ['Todos os temas', 'Ultrassom', 'Placenta', 'Hemorragia', 'Líquido amniótico'] }
  };
  var D = {
    'iota-terminos.html': { es: 'Tipos de tumor, componente sólido, score color y medidas (consenso IOTA).', en: 'Tumor types, solid component, color score and measurements (IOTA consensus).', pt: 'Tipos de tumor, componente sólido, escore de cor e medidas (consenso IOTA).', ph: 'Buscar lâmina, termo ou classificação', nada: 'Nenhuma lâmina corresponde à busca.', ax1: ['Todas', 'Ginecologia', 'Obstetrícia'], ax2: ['Todos os temas', 'Ultrassom', 'Placenta', 'Hemorragia', 'Líquido amniótico'] },
    'iota-reglas-simples.html': { es: 'Rasgos B1–B5 y M1–M5, resultado benigno, maligno o no concluyente.', en: 'B1–B5 and M1–M5 features; benign, malignant or inconclusive result.', pt: 'Características B1–B5 e M1–M5; resultado benigno, maligno ou inconclusivo.' },
    'musa.html': { es: 'Rasgos directos e indirectos de adenomiosis, mioma o adenomiosis y tipos FIGO 0 a 8.', en: 'Direct and indirect adenomyosis features, fibroid or adenomyosis, and FIGO types 0 to 8.', pt: 'Características diretas e indiretas de adenomiose, mioma ou adenomiose e tipos FIGO 0 a 8.' },
    'ieta.html': { es: 'Ecogenicidad, línea media, unión endometrio-miometrio, score color, patrón vascular y medición del grosor.', en: 'Echogenicity, midline, endometrial-myometrial junction, color score, vascular pattern and thickness measurement.', pt: 'Ecogenicidade, linha média, junção endométrio-miométrio, escore de cor, padrão vascular e medida da espessura.' },
    'ila.html': { es: 'Técnica de 4 cuadrantes, bolsillo máximo, cálculo y puntos de corte.', en: 'Four-quadrant technique, deepest pocket, calculation and cut-offs.', pt: 'Técnica dos 4 quadrantes, maior bolsão, cálculo e pontos de corte.' },
    'segmentos-utero.html': { es: 'Pedículos, patología típica y métodos hemostáticos de cada sector.', en: 'Pedicles, typical condition and hemostatic methods for each sector.', pt: 'Pedículos, patologia típica e métodos hemostáticos de cada setor.' },
    'pas.html': { es: 'Grados FIGO y clasificación topográfica 0 a 5L con pedículos, procedimiento vascular y tratamiento.', en: 'FIGO grades and topographic classification 0 to 5L with pedicles, vascular procedure and treatment.', pt: 'Graus FIGO e classificação topográfica 0 a 5L com pedículos, procedimento vascular e tratamento.' },
    'pas-ecografia.html': { es: 'Vejiga semillena, línea S1/S2 y vía de exploración de cada tipo en cortes sagital, axial y coronal.', en: 'Half-full bladder, S1/S2 line and scanning route for each type on sagittal, axial and coronal views.', pt: 'Bexiga semicheia, linha S1/S2 e via de exame de cada tipo nos cortes sagital, axial e coronal.' },
    'histerotomia-ward.html': { es: 'Animación paso a paso: histerotomía sin cortar la placenta en la previa anterior y variante alta en el PAS.', en: 'Step-by-step animation: hysterotomy without transecting the placenta in anterior previa, and high variant in PAS.', pt: 'Animação passo a passo: histerotomia sem cortar a placenta na prévia anterior e variante alta no PAS.' },
    'zonas-ureterales.html': { es: 'Cinco puntos de riesgo del uréter en la cesárea y la histerectomía obstétrica, con prevención.', en: 'Five ureteral risk points in cesarean section and obstetric hysterectomy, with prevention.', pt: 'Cinco pontos de risco do ureter na cesárea e na histerectomia obstétrica, com prevenção.' },
    'suturas-compresivas.html': { es: 'B-Lynch, Hayman, Ho-Cho y B-Lynch 2 animadas, con elección por sector S1/S2.', en: 'Animated B-Lynch, Hayman, Ho-Cho and B-Lynch 2, with choice by sector S1/S2.', pt: 'B-Lynch, Hayman, Ho-Cho e B-Lynch 2 animadas, com escolha por setor S1/S2.' },
    'torniquete-uterino.html': { es: 'Torniquete con guante paso a paso y compresión aórtica manual como hemostasia primaria.', en: 'Step-by-step glove tourniquet and manual aortic compression as primary hemostasis.', pt: 'Torniquete com luva passo a passo e compressão aórtica manual como hemostasia primária.' },
    'pas-conducta.html': { es: 'Flujograma intraoperatorio: criterios de OSCS, histerectomía total o subtotal modificada y pasos de cada técnica.', en: 'Intraoperative flowchart: criteria for OSCS, total or modified subtotal hysterectomy, and steps of each technique.', pt: 'Fluxograma intraoperatório: critérios de OSCS, histerectomia total ou subtotal modificada e passos de cada técnica.' },
    'o-rads.html': { es: 'Categorías 0–5 de O-RADS US v2022 con descriptores y conducta; versión IOTA/ADNEX.', en: 'O-RADS US v2022 categories 0–5 with descriptors and management; IOTA/ADNEX version.', pt: 'Categorias 0–5 do O-RADS US v2022 com descritores e conduta; versão IOTA/ADNEX.' }
  };
  /* ejes: área (g/o) y tema (eco, pla, hpp, liq); clave extra para buscar siglas */
  var EJ = {
    'iota-terminos.html': ['g', 'eco', 'IOTA anexo ovario masa'], 'iota-reglas-simples.html': ['g', 'eco', 'IOTA B1 M1 anexo ovario'], 'o-rads.html': ['g', 'eco', 'ORADS O-RADS ADNEX ovario anexo'],
    'musa.html': ['g', 'eco', 'MUSA adenomiosis mioma fibroid FIGO PALM'], 'ieta.html': ['g', 'eco', 'IETA endometrio endometrium'],
    'ila.html': ['o', 'liq', 'ILA AFI oligohidramnios polihidramnios bolsillo pocket Phelan'], 'segmentos-utero.html': ['o', 'hpp', 'S1 S2 S3 HPP PPH hemorragia pedículos torniquete'],
    'pas.html': ['o', 'pla', 'PAS acretismo accreta FIGO topografía'], 'pas-ecografia.html': ['o', 'pla eco', 'PAS S1 S2 vejiga bladder ecografía'], 'pas-conducta.html': ['o', 'pla hpp', 'PAS OSCS MSTH histerectomía hysterectomy'], 'histerotomia-ward.html': ['o', 'pla hpp', 'Ward previa histerotomía hysterotomy cesárea'], 'zonas-ureterales.html': ['o', 'hpp', 'uréter ureter vejiga histerectomía lesión'], 'suturas-compresivas.html': ['o', 'hpp', 'B-Lynch Hayman Cho sutura compresiva atonía'], 'torniquete-uterino.html': ['o', 'hpp', 'torniquete tourniquet guante aorta compresión']
  };
  var A1 = ['', 'g', 'o'], A2 = ['', 'eco', 'pla', 'hpp', 'liq'], f = { a: 0, t: 0 };
  function norm(x) { return String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function chip(el, list, cur, g) { el.innerHTML = list.map(function (n, i) { return '<button type="button" data-g="' + g + '" data-i="' + i + '" aria-pressed="' + (cur === i) + '">' + A.esc(n) + '</button>'; }).join(''); }
  function pintar() {
    var u = A.textos(UI), q = norm(document.getElementById('q').value.trim());
    document.getElementById('q').placeholder = u.ph;
    chip(document.getElementById('ej1'), u.ax1, f.a, 'a'); chip(document.getElementById('ej2'), u.ax2, f.t, 't');
    var v = A.LAMINAS.filter(function (x) {
      var e = EJ[x.href] || ['', '', ''];
      if (f.a && e[0] !== A1[f.a]) return false;
      if (f.t && e[1].split(' ').indexOf(A2[f.t]) < 0) return false;
      if (!q) return true;
      var txt = norm([x.t.es, x.t.en, x.t.pt, D[x.href].es, D[x.href].en, D[x.href].pt, e[2]].join(' '));
      return q.split(/\s+/).every(function (w) { return txt.indexOf(w) >= 0; });
    });
    document.getElementById('lst').innerHTML = v.map(function (x) {
      return '<a href="' + x.href + '"><b>' + A.esc(x.t[A.lang]) + '</b><span>' + A.esc(D[x.href][A.lang]) + '</span></a>';
    }).join('');
    document.getElementById('nada').hidden = v.length > 0;
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.l) { A.setLang(b.dataset.l); pintar(); return; }
    if (b.dataset.g) { f[b.dataset.g] = +b.dataset.i; pintar(); }
  });
  document.getElementById('q').addEventListener('input', pintar);
  pintar();
})();
</script>
</body>
</html>
